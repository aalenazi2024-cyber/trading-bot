# IBC Configuration for automated IB Gateway login
# Copy this to /opt/ibc/config.ini after editing

# Your IBKR login credentials
IbLoginId=YOUR_IBKR_USERNAME
IbPassword=YOUR_IBKR_PASSWORD

# Trading mode: paper or live
TradingMode=paper

# IB Gateway settings
IbDir=/opt/ibgateway
FIX=no

# Auto-accept incoming API connections
AcceptIncomingConnectionAction=accept

# Accept non-brokerage account warning
AcceptNonBrokerageAccountWarning=yes

# Dismiss various dialogs automatically
DismissPasswordExpiryWarning=yes
DismissNSEComplianceNotice=yes

# Keep IB Gateway running
ClosedownAt=
ExistingSessionDetectedAction=primary

# API port (must match your .env IBKR_PORT)
OverrideTwsApiPort=4002

# Read-only API = no (we need to trade!)
ReadOnlyLogin=no

# Log settings
IbcLogLevel=info
